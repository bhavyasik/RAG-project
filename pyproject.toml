[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-project"
version = "0.1.0"
description = "RAG application with hybrid retrieval (BM25 + vector search)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "chromadb==1.5.5",
    "fastapi==0.115.12",
    "langchain==1.2.10",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.1",
    "langchain-core==1.2.17",
    "langchain-groq==1.1.2",
    "langchain-huggingface==1.2.1",
    "numpy==2.2.3",
    "pydantic==2.10.6",
    "pypdf==5.1.0",
    "python-dotenv==1.0.1",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.4.1",
    "uvicorn==0.34.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx>=0.27",
]

[project.scripts]
rag-ingest = "app.ingestion:run_ingestion"
rag-query = "app.main:main"
rag-serve = "app.api:run_server"

[tool.hatch.build.targets.wheel]
packages = ["app"]
